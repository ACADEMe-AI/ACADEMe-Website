<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete your ACADEMe account</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:520px;margin:3rem auto;padding:0 1.25rem;color:#1c1c1e;line-height:1.5;background:#f6f7fa}
input{display:block;width:100%;padding:.65rem;margin:.4rem 0 .9rem;border:1px solid #ccc;border-radius:8px;font-size:1rem;box-sizing:border-box}
button{width:100%;padding:.75rem;border:0;border-radius:8px;background:#e03e4d;color:#fff;font-size:1rem;cursor:pointer;margin-top:.5rem}
button.secondary{background:#333}
#msg{margin-top:1rem;padding:.75rem;border-radius:8px;display:none}
.err{background:#fdecea;color:#b3261e;display:block!important}
.ok{background:#e6f4ea;color:#137333;display:block!important}
form{border:1px solid #eee;border-radius:12px;padding:1.25rem;background:#fff}
h1{font-size:1.5rem}
.hidden{display:none}
</style>
</head>
<body>
<h1>ACADEMe Account Deletion</h1>
<p>This permanently deletes your ACADEMe account, including progress, uploads and chat history. This cannot be undone.</p>

<form id="step1" onsubmit="return requestOtp(event)">
<label>Email of the account to delete</label>
<input id="email" type="email" required placeholder="you@example.com">
<button type="submit">Send verification code</button>
</form>

<form id="step2" class="hidden" onsubmit="return confirmDelete(event)">
<label>Enter the code emailed to you</label>
<input id="otp" required inputmode="numeric" placeholder="6-digit code">
<button type="submit" style="background:#e03e4d">Permanently delete my account</button>
<button type="button" class="secondary" onclick="location.reload()">Cancel</button>
</form>

<div id="msg"></div>

<script>
// API base: same origin works when the Vercel deployment proxies /api to the
// ACADEMe backend (see vercel.json). Change here if that changes.
const API_BASE = window.location.origin;
const E = document.getElementById('msg');
function show(t, m){ E.textContent = m; E.className = t; }
async function requestOtp(e){ e.preventDefault();
  const email = document.getElementById('email').value.trim();
  try{
    const r = await fetch(API_BASE + '/api/users/delete-account/request', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})});
    if(r.ok){ document.getElementById('step1').classList.add('hidden'); document.getElementById('step2').classList.remove('hidden'); show('ok','If an ACADEMe account exists for this address, a code has been sent.'); }
    else show('err','Something went wrong. Please try again.');
  }catch(_){ show('err','Network error. Please try again.'); }
  return false;
}
async function confirmDelete(e){ e.preventDefault();
  const email = document.getElementById('email').value.trim(), otp = document.getElementById('otp').value.trim();
  try{
    const r = await fetch(API_BASE + '/api/users/delete-account/confirm', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, otp})});
    const d = await r.json().catch(()=>({}));
    if(r.ok){ document.getElementById('step2').innerHTML = '<p><strong>Your account has been permanently deleted.</strong></p>'; show('ok','Account deleted.'); }
    else show('err', (d && d.detail) || 'Deletion failed. Please check the code and try again.');
  }catch(_){ show('err','Network error. Please try again.'); }
  return false;
}
</script>
</body>
</html>
